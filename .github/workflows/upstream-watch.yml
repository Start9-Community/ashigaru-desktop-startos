name: Upstream watch

# Checks daily for a new published Ashigaru Desktop release. When one appears
# and its BIP47 release signature and hash chain verify, it opens a pull
# request that bumps the Dockerfile pins and startos/versions/current.ts.
# Nothing is released from here: a person rewrites the release notes, tests
# the build on StartOS and merges, which publishes to Community Beta. See
# .github/scripts/upstream_bump.py.
#
# Requires the UPSTREAM_BOT_TOKEN secret: a fine-grained token for this
# repository with Contents and Pull requests set to read and write. It pushes
# the branch and opens the pull request; the default GITHUB_TOKEN can't open
# pull requests here, and a pull request it opened wouldn't start Build. The
# token is passed only to the steps that write, never stored in .git/config.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the bot token
        env:
          BOT_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: |
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::UPSTREAM_BOT_TOKEN is not set. See UPDATING.md (Automated bump)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install signature verification dependency
        run: pip install coincurve==21.0.0

      - name: Check upstream and verify the release
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I .github/scripts/upstream_bump.py --repo . --body "$RUNNER_TEMP/pr-body.md"

      # Matches open pull requests from any branch or fork, not just this
      # repository's branches.
      - name: Skip if a pull request for this version is already open
        id: existing
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          title="Update Ashigaru Desktop to ${VERSION}"
          open=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${title}\" in:title" --json title \
            --jq "[.[] | select(.title == \"${title}\")] | length")
          if [ "${open}" != "0" ]; then
            echo "An open pull request is already titled '${title}'; leaving it alone."
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.existing.outputs.open == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Format the edited version file
        if: steps.existing.outputs.open == 'false'
        run: |
          npm ci --ignore-scripts
          npx prettier --config node_modules/@start9labs/start-sdk/prettier.config.json --write startos

      # The branch is the bot's own, so a leftover from a run that pushed but
      # failed to open its pull request is overwritten rather than skipped.
      - name: Open the pull request
        if: steps.existing.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="upstream/v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          git add Dockerfile startos/versions/current.ts
          git commit -m "Update Ashigaru Desktop to ${VERSION}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${branch}" \
            --title "Update Ashigaru Desktop to ${VERSION}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
